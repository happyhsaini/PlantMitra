services:
  postgres:
    image: postgres:16-alpine
    container_name: plantmitra-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-plantmitra}
      POSTGRES_USER: ${POSTGRES_USER:-plantmitra}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-plantmitra}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - plantmitra_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-plantmitra} -d ${POSTGRES_DB:-plantmitra}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  plantmitra_pgdata:
